[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmkit"
version = "0.1.0"
description = "Polymarket market analysis and paper-trading toolkit (read-only, no order routing)"
readme = "README.md"
license = {text = "Proprietary"}
authors = [{name = "agenta"}]
requires-python = "3.10+"
dependencies = []

[project.urls]
Homepage = "https://github.com/Pkaulsjs/pmkit"

[tool.setuptools.packages.find]
where = ["src"]
